services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
       - /home/user/configs/cloudflared/config.yml:/etc/cloudflared/config.yml:ro
    restart: unless-stopped

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /home/user/configs/jellyfin:/config
      - /home/user/data/media:/media
    ports:
      - 8096:8096
    restart: unless-stopped

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    environment:
      - TZ=Asia/Kolkata
      - SIGNUPS_ALLOWED=false
      - WEBSOCKET_ENABLED=true
    volumes:
      - /home/user/data/vaultwarden:/data
    restart: unless-stopped

  axew:
    image: adithyasrc/axew:latest
    container_name: axew
    pid: host
    privileged: true
    volumes:
      - /home/user/configs/axew/config.yaml:/app/config.yaml:ro
    restart: unless-stopped

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless
    depends_on:
      - paperless-db
      - paperless-gotenberg
      - paperless-tika
    volumes:
      - /home/user/data/paperless/data:/usr/src/paperless/data
      - /home/user/data/paperless/media:/usr/src/paperless/media
      - /home/user/data/paperless/export:/usr/src/paperless/export
      - /home/user/data/paperless/consume:/usr/src/paperless/consume
    environment:
      PAPERLESS_REDIS: redis://paperless-db:6379
      PAPERLESS_DBENGINE: sqlite
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://paperless-gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://paperless-tika:9998
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      PAPERLESS_URL: ${PAPERLESS_URL}
      PAPERLESS_CSRF_TRUSTED_ORIGINS: ${PAPERLESS_CSRF_TRUSTED_ORIGINS}
    restart: unless-stopped

  paperless-db:
    image: docker.io/valkey/valkey:9-alpine
    container_name: paperless-db
    restart: unless-stopped
    volumes:
      - /home/user/data/paperless/valkey:/data

  paperless-gotenberg:
    image: docker.io/gotenberg/gotenberg:8.34
    container_name: paperless-gotenberg
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"

  paperless-tika:
    image: docker.io/apache/tika:3.3.1.0
    container_name: paperless-tika
    restart: unless-stopped

  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    environment:
      - PUID=1000
      - PGID=1000
      - SLSKD_SHARED_DIR=/music
    ports:
      - 4533:4533
    volumes:
      - "/home/user/configs/navidrome:/data"
      - "/home/user/data/music:/music:ro"
    restart: unless-stopped

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /home/user/configs/sabnzbd:/config
    restart: unless-stopped

  # dont need these to run always, turn them on with
  # docker compose --profile p2p up -d

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    profiles:
      - p2p
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - /home/user/configs/qbittorrent:/config
      - /home/user/data/media:/downloads
    ports:
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped

  soulseek:
    image: slskd/slskd
    container_name: soulseek
    profiles:
      - p2p
    user: "1000:1000"
    environment:
      - SLSKD_REMOTE_CONFIGURATION=true
    volumes:
      - "/home/user/configs/soulseek:/app"
    restart: unless-stopped


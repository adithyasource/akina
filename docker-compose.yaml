services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
       - /home/user/configs/cloudflared/config.yml:/etc/cloudflared/config.yml:ro
    restart: unless-stopped

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /home/user/configs/jellyfin:/config
      - /home/user/data/media:/media
    ports:
      - 8096:8096
    restart: unless-stopped

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    environment:
      - TZ=Asia/Kolkata
      - SIGNUPS_ALLOWED=false
      - WEBSOCKET_ENABLED=true
    volumes:
      - /home/user/data/vaultwarden:/data
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - /home/user/configs/qbittorrent:/config
      - /home/user/data/media:/downloads
    ports:
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped

  axew:
    image: adithyasrc/axew:latest
    container_name: axew
    pid: host
    privileged: true
    volumes:
      - /home/user/configs/axew/config.yaml:/app/config.yaml:ro
    restart: unless-stopped


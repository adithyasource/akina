# requires: procps lm-sensors tuptime

tick_interval: 3

commands:
  - name: kernel
    cmd: grep '^PRETTY_NAME=' /etc/*-release | cut -d= -f2- | tr -d '"'
    mode: static

  - name: date
    cmd: date

  - name: vmstat
    cmd: vmstat 1 2 -S M | awk 'NR<=2 || NR==4'

  - name: disk usage
    cmd: df -h /
    mode: static

  - name: sensors
    cmd: >
      sensors | awk '/Package id 0:|Core 0:|Core 1:|Exhaust/ {print}'

  - name: internal bcm4331 stats
    cmd: >
      (cat /proc/net/dev; sleep 1; cat /proc/net/dev) | grep "wlp2s0:" | awk 'NR==1{rx1=$2;tx1=$10} NR==2{printf "RX: %.2f MB/s, TX: %.2f MB/s\n", ($2-rx1)/1024/1024, ($10-tx1)/1024/1024}'

  - name: usb rtw8812 stats
    cmd: >
      (cat /proc/net/dev; sleep 1; cat /proc/net/dev) | grep "wlx20e15d3dc107:" | awk 'NR==1{rx1=$2;tx1=$10} NR==2{printf "RX: %.2f MB/s, TX: %.2f MB/s\n", ($2-rx1)/1024/1024, ($10-tx1)/1024/1024}'

  - name: system usage cpu
    cmd: >
      ps -eo comm,%cpu --sort=-%cpu | head -6

  - name: uptime records
    cmd: tuptime --tsince -172800 -t
    mode: static

  - name: docker
    cmd: docker stats --no-stream

  - name: restic logs
    cmd: >
      tail -n 4 /home/user/.logs/restic
    mode: static
